<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Bookshelf | قِصّہ کِتاب گھر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Noto+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splashScreen">
  <div class="splash-shelf-wrap">
    <span class="splash-sparkle" style="top:-22px; left:-26px; animation-delay:.3s;">✨</span>
    <span class="splash-sparkle" style="top:-6px; right:-30px; animation-delay:1s;">⭐</span>
    <span class="splash-sparkle" style="bottom:-4px; left:44%; animation-delay:1.6s;">✨</span>
    <div class="splash-shelf">
      <div class="splash-book" style="--tilt:-6deg;">🦓</div>
      <div class="splash-book" style="--tilt:4deg;">🐢</div>
      <div class="splash-book" style="--tilt:-3deg;">📖</div>
      <div class="splash-book" style="--tilt:5deg;">🚀</div>
      <div class="splash-book" style="--tilt:-4deg;">🐘</div>
    </div>
    <div class="splash-plank"></div>
  </div>
  <div class="splash-title-wrap">
    <p class="splash-title-ur">قِصّہ کِتاب گھر</p>
    <p class="splash-title-en">Quiz Bookshelf</p>
  </div>
  <button class="splash-start-btn" id="splashStartBtn" aria-label="Tap to start — شروع کریں">
    📖 Tap to Start <span class="ur">— شروع کریں</span>
  </button>
</div>

<div id="app"></div>

<script src="shared.js"></script>
<script>
/* ============================ QUIZ-ONLY APP ============================ */
let view = 'home'; // home | bookDetail | quiz | result
let currentBookId = null;
let quizState = null; // {questions, pos, score, answeredThis, mode:'page'|'combined', pageLabel}

const app = document.getElementById('app');

function topbar(){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">📚</div>
      <div class="brand-text">${esc(t('title'))}<small>قِصّہ کِتاب گھر</small></div>
    </div>
    <div class="topbar-actions">
      <button class="pill-btn ghost" id="langBtn">🌐 ${esc(t('langToggle'))}</button>
    </div>
  </div>`;
}
function bindTopbar(){
  const langBtn = document.getElementById('langBtn');
  if(langBtn) langBtn.addEventListener('click', ()=>{ lang = lang==='en'?'ur':'en'; localStorage.setItem(LANG_KEY, lang); setLangDir(); render(); });
}

/* ---------- Home ---------- */
function renderHome(){
  const books = data.books;
  const rows = [];
  for(let i=0;i<books.length;i+=4) rows.push(books.slice(i,i+4));

  const shelfHTML = books.length===0
    ? `<div class="empty-shelf">📖<br><br>${esc(t('noBooks'))}</div>`
    : rows.map(row => `
        <div class="shelf-books">
          ${row.map(b=>`
            <button class="book-card" style="--tilt:${(Math.random()*6-3).toFixed(1)}deg; background:linear-gradient(160deg, ${b.color}, ${shade(b.color,-18)});" data-book="${b.id}">
              <div class="book-icon">${b.icon||'📗'}</div>
              <div class="book-title-ur">${esc(b.title)}</div>
              <div class="book-meta">${esc(t('pagesCount')(b.pages.length))} · ${esc(t('questionsCount')(bookQuestionCount(b)))}</div>
            </button>`).join('')}
        </div>
        <div class="shelf-plank"></div>
      `).join('');

  app.innerHTML = `
    ${topbar()}
    <div class="hero">
      <h1>${esc(t('title'))}</h1>
      <div class="ur-title">قِصّہ کِتاب گھر</div>
      <p>${esc(t('subtitle'))}</p>
    </div>
    <div class="shelf-row">${shelfHTML}</div>
  `;
  bindTopbar();
  app.querySelectorAll('.book-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentBookId = btn.dataset.book;
      view = 'bookDetail';
      render();
    });
  });
}

/* ---------- Book detail: pick a page or the full-book quiz ---------- */
function renderBookDetail(){
  const book = data.books.find(b=>b.id===currentBookId);
  const pages = sortedPages(book);
  const total = bookQuestionCount(book);

  const pagesHTML = pages.length===0
    ? `<div class="empty-shelf">📄<br><br>${esc(t('noPagesInBook'))}</div>`
    : `<div class="pages-grid">
        ${pages.map(p=>`
          <button class="page-card" data-page="${p.id}" ${p.questions.length===0?'disabled style="opacity:.5;"':''}>
            <div class="page-num">${esc(t('page')(p.number))}</div>
            <div class="page-sub">${esc(t('questionsCount')(p.questions.length))}</div>
          </button>`).join('')}
      </div>`;

  app.innerHTML = `
    ${topbar()}
    <div class="book-detail-header">
      <button class="pill-btn ghost" id="backHomeBtn">← ${esc(t('backHome'))}</button>
      <div class="book-detail-title">
        <span class="icon">${esc(book.icon)}</span>
        <span class="ur">${esc(book.title)}</span>
      </div>
      <div></div>
    </div>
    ${total>0 ? `
      <div class="full-quiz-card">
        <div class="fq-text">
          <span class="fq-icon">🏆</span>
          <div>
            <h3>${esc(t('fullQuizTitle'))}</h3>
            <p>${esc(t('fullQuizDesc'))} · ${esc(t('questionsCount')(total))}</p>
          </div>
        </div>
        <button id="fullQuizBtn">${esc(t('startQuizBtn'))} →</button>
      </div>` : ''}
    ${pagesHTML}
  `;
  bindTopbar();
  document.getElementById('backHomeBtn').addEventListener('click', ()=>{ view='home'; currentBookId=null; render(); });
  const fqBtn = document.getElementById('fullQuizBtn');
  if(fqBtn) fqBtn.addEventListener('click', ()=> startQuiz(currentBookId, null));
  app.querySelectorAll('.page-card:not([disabled])').forEach(btn=>{
    btn.addEventListener('click', ()=> startQuiz(currentBookId, btn.dataset.page));
  });
}

/* ---------- Quiz ---------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
/* Returns a fresh copy of the question with its options (and correct index) shuffled. */
function shuffleQuestionOptions(q){
  const order = shuffleArray(q.options.map((_,i)=>i)); // shuffled list of original indices
  return {
    ...q,
    options: order.map(i=>q.options[i]),
    correct: order.indexOf(q.correct)
  };
}
function startQuiz(bookId, pageId){
  currentBookId = bookId;
  const book = data.books.find(b=>b.id===bookId);
  let questions, pageLabel;
  if(pageId){
    const page = book.pages.find(p=>p.id===pageId);
    questions = page.questions.slice();
    pageLabel = t('page')(page.number);
  } else {
    questions = sortedPages(book).flatMap(p=>p.questions);
    pageLabel = t('fullQuizTitle');
  }
  if(questions.length===0){ alert(t('pageEmptyNote')); return; }
  questions = shuffleArray(questions).map(shuffleQuestionOptions);
  quizState = { questions, pos:0, score:0, answeredThis:false, mode: pageId?'page':'combined', pageId, pageLabel };
  view='quiz';
  render();
}
function renderQuiz(){
  const book = data.books.find(b=>b.id===currentBookId);
  const q = quizState.questions[quizState.pos];
  const total = quizState.questions.length;
  const pct = Math.round((quizState.pos)/total*100);

  app.innerHTML = `
    ${topbar()}
    <div class="quiz-header">
      <button class="pill-btn ghost" id="backHomeBtn">← ${esc(t('backToBook'))}</button>
      <div class="quiz-book-title">${esc(book.icon)} ${esc(book.title)} — <span style="font-size:1rem;">${esc(quizState.pageLabel)}</span></div>
      <div style="font-weight:700;color:var(--ink-soft);">${esc(t('question'))} ${quizState.pos+1} ${esc(t('of'))} ${total}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="question-card"><div class="question-text">${esc(q.text)}</div></div>
    <div class="options-grid" id="optionsGrid">
      ${q.options.map((opt,i)=>`
        <div class="option-card" data-idx="${i}">
          <button class="flip-trigger">
            <div class="card-inner">
              <div class="card-face card-front">${esc(opt)}</div>
              <div class="card-face card-back"><span class="icon"></span><span class="back-text"></span><span class="label"></span></div>
            </div>
          </button>
        </div>`).join('')}
    </div>
    <div class="quiz-footer">
      <div></div>
      <button class="next-btn" id="nextBtn">${quizState.pos===total-1 ? esc(t('finish')) : esc(t('next'))} →</button>
    </div>
  `;
  document.getElementById('backHomeBtn').addEventListener('click', ()=>{ view='bookDetail'; quizState=null; render(); });

  app.querySelectorAll('.option-card').forEach(card=>{
    card.querySelector('.flip-trigger').addEventListener('click', ()=>{
      if(quizState.answeredThis) return;
      quizState.answeredThis = true;
      const idx = parseInt(card.dataset.idx,10);
      const isCorrect = idx === q.correct;
      card.classList.add('flipped', isCorrect?'correct':'incorrect');
      card.querySelector('.card-back .icon').textContent = isCorrect ? '✓' : '✕';
      card.querySelector('.card-back .back-text').textContent = q.options[idx];
      card.querySelector('.card-back .label').textContent = isCorrect ? t('flipHintCorrect') : t('flipHintIncorrect');
      if(isCorrect) quizState.score++;
      app.querySelectorAll('.option-card').forEach(c=>{
        c.classList.add('disabled');
        const ci = parseInt(c.dataset.idx,10);
        if(ci===q.correct && c!==card){
          c.classList.add('flipped','correct');
          c.querySelector('.card-back .icon').textContent='✓';
          c.querySelector('.card-back .back-text').textContent = q.options[ci];
          c.querySelector('.card-back .label').textContent = t('flipHintCorrectAnswer');
        }
      });
      document.getElementById('nextBtn').classList.add('show');
    });
  });

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(quizState.pos < total-1){
      quizState.pos++; quizState.answeredThis=false; render();
    } else {
      view='result'; render();
    }
  });
}

/* ---------- Result ---------- */
function renderResult(){
  const book = data.books.find(b=>b.id===currentBookId);
  const total = quizState.questions.length;
  const score = quizState.score;
  const ratio = score/total;
  const stars = ratio>=1 ? '⭐⭐⭐' : ratio>=0.6 ? '⭐⭐' : ratio>0 ? '⭐' : '💫';
  const msg = ratio>=1 ? t('great') : ratio>=0.6 ? t('good') : ratio>0.3 ? t('okay') : t('practice');

  app.innerHTML = `
    ${topbar()}
    <div class="hero" style="margin-top:10px;">
      <div class="ur-title">${esc(book.icon)} ${esc(book.title)} — ${esc(quizState.pageLabel)}</div>
    </div>
    <div class="result-card">
      <div class="stars">${stars}</div>
      <p style="font-weight:800;font-size:1.1rem;">${esc(msg)}</p>
      <p style="color:var(--ink-soft);margin:0;">${esc(t('yourScore'))}</p>
      <p class="result-score">${score} / ${total}</p>
      <div class="result-actions">
        <button class="btn-solid" id="retakeBtn">🔁 ${esc(t('retake'))}</button>
        <button class="btn-outline" id="bookBtn2">📘 ${esc(t('backToBook'))}</button>
        <button class="btn-outline" id="homeBtn2">🏠 ${esc(t('home'))}</button>
      </div>
    </div>
  `;
  bindTopbar();
  document.getElementById('retakeBtn').addEventListener('click', ()=>{ startQuiz(currentBookId, quizState.pageId||null); });
  document.getElementById('bookBtn2').addEventListener('click', ()=>{ view='bookDetail'; quizState=null; render(); });
  document.getElementById('homeBtn2').addEventListener('click', ()=>{ view='home'; currentBookId=null; quizState=null; render(); });
}

/* ---------- Router ---------- */
function render(){
  setLangDir();
  if(view==='home') renderHome();
  else if(view==='bookDetail') renderBookDetail();
  else if(view==='quiz') renderQuiz();
  else if(view==='result') renderResult();
}
render();

/* ---------- Launch splash screen ---------- */
(function(){
  const splash = document.getElementById('splashScreen');
  if(!splash) return;
  let dismissed = false;
  function dismiss(){
    if(dismissed) return;
    dismissed = true;
    splash.classList.add('hide');
    document.removeEventListener('keydown', onKey);
    setTimeout(()=>{ splash.remove(); }, 550);
  }
  function onKey(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); dismiss(); } }
  splash.addEventListener('click', dismiss);
  document.addEventListener('keydown', onKey);
})();
</script>
</body>
</html>
