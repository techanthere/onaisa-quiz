<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Quiz Bookshelf</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Noto+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<script src="shared.js"></script>
<script>
/* ============================ ADMIN PASSCODE GATE ============================ */
/* NOTE: this is a light deterrent, not real security — anyone who views this
   file's source can read the passcode below. It just keeps casual visitors
   (and kids clicking around) from stumbling into the admin tools; it does not
   protect the data itself, since it all lives in the browser's localStorage.
   Change ADMIN_PASSCODE to whatever you like before you host this. */
const ADMIN_PASSCODE = 'kachwa2026';
let unlocked = sessionStorage.getItem('adminUnlocked') === '1';

const app = document.getElementById('app');

function renderGate(){
  app.innerHTML = `
    <div class="gate-wrap">
      <div class="gate-card">
        <div class="gate-icon">🔒</div>
        <h2>${esc(t('passcodeTitle'))}</h2>
        <div class="field">
          <label>${esc(t('passcodeLabel'))}</label>
          <input type="password" id="passcodeInput" autofocus>
        </div>
        <button class="btn-primary" id="passcodeBtn" style="width:100%;">${esc(t('passcodeBtn'))}</button>
        <div class="inline-msg bad" id="passcodeMsg"></div>
      </div>
    </div>
  `;
  const tryUnlock = ()=>{
    const val = document.getElementById('passcodeInput').value;
    if(val === ADMIN_PASSCODE){
      unlocked = true;
      sessionStorage.setItem('adminUnlocked','1');
      render();
    } else {
      document.getElementById('passcodeMsg').textContent = t('passcodeWrong');
    }
  };
  document.getElementById('passcodeBtn').addEventListener('click', tryUnlock);
  document.getElementById('passcodeInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryUnlock(); });
}

/* ============================ ADMIN APP ============================ */
let adminTab = 'books';
let adminSelectedBookId = null;
let adminSelectedPageId = null;
let editingBookId = null;
let newBookColor = PALETTE[0];
let newBookIcon = ICONS[0];
let editingPageId = null;
let editingQuestionId = null;
let currentOptionCount = 4; // how many option rows shown in the question form

function topbar(){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">⚙️</div>
      <div class="brand-text">${esc(t('title'))}<small>ایڈمن</small></div>
    </div>
    <div class="topbar-actions">
      <button class="pill-btn ghost" id="langBtn">🌐 ${esc(t('langToggle'))}</button>
      <a class="pill-btn" href="index.html">🏠 ${esc(t('backHome'))}</a>
    </div>
  </div>`;
}
function bindTopbar(){
  const langBtn = document.getElementById('langBtn');
  if(langBtn) langBtn.addEventListener('click', ()=>{ lang = lang==='en'?'ur':'en'; localStorage.setItem(LANG_KEY, lang); setLangDir(); render(); });
}

function ensureSelections(){
  if(!adminSelectedBookId && data.books.length) adminSelectedBookId = data.books[0].id;
  const book = data.books.find(b=>b.id===adminSelectedBookId);
  if(book){
    const pages = sortedPages(book);
    if(!pages.find(p=>p.id===adminSelectedPageId)) adminSelectedPageId = pages.length ? pages[0].id : null;
  } else {
    adminSelectedPageId = null;
  }
  return book;
}

function renderAdmin(){
  app.innerHTML = `
    ${topbar()}
    <div class="admin-header"><h1 style="font-family:'Baloo 2',sans-serif;">${esc(t('adminTitle'))}</h1></div>
    <div class="tabs">
      <button class="tab-btn ${adminTab==='books'?'active':''}" data-tab="books">${esc(t('tabBooks'))}</button>
      <button class="tab-btn ${adminTab==='pages'?'active':''}" data-tab="pages">${esc(t('tabPages'))}</button>
      <button class="tab-btn ${adminTab==='questions'?'active':''}" data-tab="questions">${esc(t('tabQuestions'))}</button>
      <button class="tab-btn ${adminTab==='bulk'?'active':''}" data-tab="bulk">${esc(t('tabBulk'))}</button>
      <button class="tab-btn ${adminTab==='data'?'active':''}" data-tab="data">${esc(t('tabData'))}</button>
    </div>
    <div id="adminPanelHost"></div>
  `;
  bindTopbar();
  app.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>{ adminTab=b.dataset.tab; render(); }));
  const host = document.getElementById('adminPanelHost');
  if(adminTab==='books') host.innerHTML = booksPanelHTML();
  if(adminTab==='pages') host.innerHTML = pagesPanelHTML();
  if(adminTab==='questions') host.innerHTML = questionsPanelHTML();
  if(adminTab==='bulk') host.innerHTML = bulkPanelHTML();
  if(adminTab==='data') host.innerHTML = dataPanelHTML();
  bindAdminPanel();
}

/* ---- Books tab ---- */
function booksPanelHTML(){
  const editing = editingBookId ? data.books.find(b=>b.id===editingBookId) : null;
  return `
    <div class="panel">
      <h3>${editing ? t('edit') : esc(t('addBook'))}</h3>
      <div class="field">
        <label>${esc(t('bookTitleLabel'))}</label>
        <input type="text" class="urdu-input" id="bookTitleInput" placeholder="${esc(t('bookTitlePh'))}" value="${editing?esc(editing.title):''}">
      </div>
      <div class="row2">
        <div class="field">
          <label>${esc(t('colorLabel'))}</label>
          <div class="color-swatches" id="colorSwatches">
            ${PALETTE.map(c=>`<div class="swatch ${((editing?editing.color:newBookColor)===c)?'selected':''}" data-color="${c}" style="background:${c}"></div>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>${esc(t('iconLabel'))}</label>
          <div class="icon-choices" id="iconChoices">
            ${ICONS.map(ic=>`<div class="icon-choice ${((editing?editing.icon:newBookIcon)===ic)?'selected':''}" data-icon="${ic}">${ic}</div>`).join('')}
          </div>
        </div>
      </div>
      <button class="btn-primary" id="saveBookBtn">${esc(t('saveBook'))}</button>
      ${editing ? `<button class="btn-secondary" id="cancelEditBtn" style="margin-inline-start:8px;">${esc(t('cancel'))}</button>` : ''}
    </div>
    <div class="panel">
      <h3>${esc(t('yourBooks'))}</h3>
      ${data.books.length===0 ? `<div class="empty-hint">${esc(t('noBooks'))}</div>` : data.books.map(b=>`
        <div class="list-row">
          <div>
            <span class="swatch-dot" style="background:${b.color}"></span>
            <span class="label">${b.icon} ${esc(b.title)}</span>
            <div class="sub">${t('pagesCount')(b.pages.length)} · ${t('questionsCount')(bookQuestionCount(b))}</div>
          </div>
          <div class="list-actions">
            <button class="btn-secondary" data-editbook="${b.id}">${esc(t('edit'))}</button>
            <button class="btn-danger" data-delbook="${b.id}">${esc(t('delete'))}</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ---- Pages tab ---- */
function pagesPanelHTML(){
  const book = ensureSelections();
  const selectorHTML = `
    <div class="panel">
      <div class="field">
        <label>${esc(t('selectBook'))}</label>
        <select id="bookSelectPages" ${data.books.length===0?'disabled':''}>
          ${data.books.map(b=>`<option value="${b.id}" ${b.id===adminSelectedBookId?'selected':''}>${b.icon} ${esc(b.title)}</option>`).join('')}
        </select>
      </div>
    </div>`;
  if(!book){
    return selectorHTML + `<div class="panel"><div class="empty-hint">${esc(t('noBooks'))}</div></div>`;
  }
  const editing = editingPageId ? book.pages.find(p=>p.id===editingPageId) : null;
  const suggestedNext = book.pages.length ? Math.max(...book.pages.map(p=>p.number))+1 : 1;

  const formHTML = `
    <div class="panel">
      <h3>${editing ? t('edit') : esc(t('addPageTitle'))}</h3>
      <div class="field">
        <label>${esc(t('pageNumberLabel'))}</label>
        <input type="text" inputmode="numeric" id="pageNumberInput" placeholder="${esc(t('pageNumberPh'))}" value="${editing?editing.number:suggestedNext}">
      </div>
      <button class="btn-primary" id="savePageBtn">${esc(t('savePageBtn'))}</button>
      ${editing ? `<button class="btn-secondary" id="cancelPageEditBtn" style="margin-inline-start:8px;">${esc(t('cancel'))}</button>` : ''}
    </div>`;

  const pages = sortedPages(book);
  const listHTML = `
    <div class="panel">
      <h3>${esc(t('yourPages'))}</h3>
      ${pages.length===0 ? `<div class="empty-hint">${esc(t('noPagesYet'))}</div>` : pages.map(p=>`
        <div class="list-row">
          <div>
            <span class="label" style="font-family:'Baloo 2',sans-serif; direction:ltr;">${esc(t('page')(p.number))}</span>
            <div class="sub">${t('questionsCount')(p.questions.length)}</div>
          </div>
          <div class="list-actions">
            <button class="btn-secondary" data-editpage="${p.id}">${esc(t('edit'))}</button>
            <button class="btn-danger" data-delpage="${p.id}">${esc(t('delete'))}</button>
          </div>
        </div>
      `).join('')}
    </div>`;

  return selectorHTML + formHTML + listHTML;
}

/* ---- Questions tab (book + page scoped; supports 2-4 options) ---- */
function optionRowsHTML(existingOptions){
  const count = existingOptions ? existingOptions.length : currentOptionCount;
  let rows = '';
  for(let i=0;i<count;i++){
    rows += `
      <div class="opt-row">
        <span class="opt-letter">${String.fromCharCode(65+i)}</span>
        <input type="text" class="urdu-input" id="optInput${i}" value="${existingOptions?esc(existingOptions[i]):''}">
        ${count>2 ? `<button type="button" class="btn-secondary" data-removeopt="${i}">${esc(t('removeOption'))}</button>` : ''}
      </div>`;
  }
  return rows;
}
function bookPageSelectorsHTML(bookSelectId, pageSelectId){
  const book = ensureSelections();
  const pages = book ? sortedPages(book) : [];
  return `
    <div class="panel">
      <div class="row2">
        <div class="field">
          <label>${esc(t('selectBook'))}</label>
          <select id="${bookSelectId}" ${data.books.length===0?'disabled':''}>
            ${data.books.map(b=>`<option value="${b.id}" ${b.id===adminSelectedBookId?'selected':''}>${b.icon} ${esc(b.title)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>${esc(t('selectPageLabel'))}</label>
          <select id="${pageSelectId}" ${pages.length===0?'disabled':''}>
            ${pages.map(p=>`<option value="${p.id}" ${p.id===adminSelectedPageId?'selected':''}>${esc(t('page')(p.number))}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;
}
function questionsPanelHTML(){
  const book = ensureSelections();
  const selectorHTML = bookPageSelectorsHTML('bookSelect','pageSelect');
  const page = book ? sortedPages(book).find(p=>p.id===adminSelectedPageId) : null;

  if(!book || !page){
    return selectorHTML + `<div class="panel"><div class="empty-hint">${esc(t('pickBookFirst'))}</div></div>`;
  }

  const editing = editingQuestionId ? page.questions.find(q=>q.id===editingQuestionId) : null;
  if(editing) currentOptionCount = editing.options.length;

  const formHTML = `
    <div class="panel">
      <h3>${esc(t('addQuestionTitle'))}</h3>
      <div class="field">
        <label>${esc(t('questionLabel'))}</label>
        <textarea class="urdu-input" id="qTextInput" placeholder="${esc(t('questionPh'))}">${editing?esc(editing.text):''}</textarea>
      </div>
      <div class="field">
        <label>${esc(t('optionLabel'))}</label>
        <div id="optionRowsHost">${optionRowsHTML(editing?editing.options:null)}</div>
        ${currentOptionCount<4 ? `<button type="button" class="btn-secondary" id="addOptionBtn">${esc(t('addOption'))}</button>` : ''}
      </div>
      <div class="field">
        <label>${esc(t('correctLabel'))}</label>
        <select id="correctSelect">
          ${Array.from({length:currentOptionCount}).map((_,i)=>`<option value="${i}" ${editing && editing.correct===i?'selected':''}>${String.fromCharCode(65+i)}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary" id="saveQuestionBtn">${editing?esc(t('updateQuestionBtn')):esc(t('addQuestionBtn'))}</button>
      ${editing ? `<button class="btn-secondary" id="cancelQEditBtn" style="margin-inline-start:8px;">${esc(t('cancel'))}</button>` : ''}
    </div>`;

  const listHTML = `
    <div class="panel">
      <h3>${esc(t('existingQuestions'))} — ${esc(t('page')(page.number))}</h3>
      ${page.questions.length===0 ? `<div class="empty-hint">${esc(t('noQuestionsInBook'))}</div>` : page.questions.map((q,qi)=>`
        <div class="q-item">
          <div class="q-text">${qi+1}. ${esc(q.text)}</div>
          <div class="opts">
            ${q.options.map((o,i)=>`<span class="${i===q.correct?'correct-opt':''}">${String.fromCharCode(65+i)}) ${esc(o)}</span>`).join('')}
          </div>
          <div class="q-actions">
            <button class="btn-secondary" data-editq="${q.id}">${esc(t('edit'))}</button>
            <button class="btn-danger" data-delq="${q.id}">${esc(t('delete'))}</button>
          </div>
        </div>
      `).join('')}
    </div>`;

  return selectorHTML + formHTML + listHTML;
}

/* ---- Bulk import tab (book + page scoped; accepts 2-4 options; C/D optional) ---- */
function bulkPanelHTML(){
  const book = ensureSelections();
  const selectorHTML = bookPageSelectorsHTML('bulkBookSelect','bulkPageSelect');

  return `
    ${selectorHTML}
    <div class="panel">
      <h3>${esc(t('bulkTitle'))}</h3>
      <div class="help-box">${esc(t('bulkHelp'))}</div>
      <div class="field">
        <label>${esc(t('bulkTitle'))}</label>
        <textarea class="urdu-input" id="bulkTextArea" placeholder="${esc(t('bulkPlaceholder'))}" style="min-height:220px;" ${!book?'disabled':''}></textarea>
      </div>
      <button class="btn-primary" id="bulkParseBtn" ${!book?'disabled':''}>${esc(t('bulkParse'))}</button>
      ${!book ? `<div class="empty-hint">${esc(t('noBooks'))}</div>` : ''}
      <div class="inline-msg" id="bulkMsg"></div>
    </div>
  `;
}

/* ---- Data / backup tab ---- */
function dataPanelHTML(){
  return `
    <div class="panel">
      <h3>${esc(t('dataTitle'))}</h3>
      <p class="empty-hint" style="padding:0 0 10px;">${esc(t('dataSubtitle'))}</p>
      <div class="data-actions">
        <button class="btn-primary" id="exportBtn">⬇️ ${esc(t('dataExport'))}</button>
        <button class="btn-secondary" id="importBtn">⬆️ ${esc(t('dataImport'))}</button>
        <button class="btn-danger" id="resetBtn">${esc(t('dataReset'))}</button>
      </div>
      <input type="file" id="jsonFileInput" accept="application/json">
      <div class="inline-msg" id="dataMsg"></div>
    </div>
  `;
}

/* ---- Admin bindings ---- */
function bindAdminPanel(){
  if(adminTab==='books'){
    document.querySelectorAll('#colorSwatches .swatch').forEach(sw=>{
      sw.addEventListener('click', ()=>{
        document.querySelectorAll('#colorSwatches .swatch').forEach(s=>s.classList.remove('selected'));
        sw.classList.add('selected');
        newBookColor = sw.dataset.color;
      });
    });
    document.querySelectorAll('#iconChoices .icon-choice').forEach(ic=>{
      ic.addEventListener('click', ()=>{
        document.querySelectorAll('#iconChoices .icon-choice').forEach(s=>s.classList.remove('selected'));
        ic.classList.add('selected');
        newBookIcon = ic.dataset.icon;
      });
    });
    document.getElementById('saveBookBtn').addEventListener('click', ()=>{
      const title = document.getElementById('bookTitleInput').value.trim();
      if(!title){ return; }
      const selectedColor = document.querySelector('#colorSwatches .swatch.selected')?.dataset.color || PALETTE[0];
      const selectedIcon = document.querySelector('#iconChoices .icon-choice.selected')?.dataset.icon || ICONS[0];
      if(editingBookId){
        const b = data.books.find(x=>x.id===editingBookId);
        b.title=title; b.color=selectedColor; b.icon=selectedIcon;
      } else {
        data.books.push({ id:uid('b'), title, color:selectedColor, icon:selectedIcon, pages:[] });
      }
      editingBookId=null; saveData(data); render();
    });
    const cancelBtn = document.getElementById('cancelEditBtn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingBookId=null; render(); });
    document.querySelectorAll('[data-editbook]').forEach(b=>b.addEventListener('click', ()=>{
      editingBookId = b.dataset.editbook; render();
    }));
    document.querySelectorAll('[data-delbook]').forEach(b=>b.addEventListener('click', ()=>{
      if(confirm(t('deleteBookConfirm'))){
        data.books = data.books.filter(x=>x.id!==b.dataset.delbook);
        if(adminSelectedBookId===b.dataset.delbook){ adminSelectedBookId=null; adminSelectedPageId=null; }
        saveData(data); render();
      }
    }));
  }

  if(adminTab==='pages'){
    const sel = document.getElementById('bookSelectPages');
    if(sel) sel.addEventListener('change', ()=>{ adminSelectedBookId=sel.value; adminSelectedPageId=null; editingPageId=null; render(); });
    const saveP = document.getElementById('savePageBtn');
    if(saveP) saveP.addEventListener('click', ()=>{
      const book = data.books.find(b=>b.id===adminSelectedBookId);
      const num = parseInt(document.getElementById('pageNumberInput').value,10);
      if(!book || isNaN(num)) return;
      if(editingPageId){
        const p = book.pages.find(x=>x.id===editingPageId);
        p.number = num;
      } else {
        book.pages.push({ id:uid('pg'), number:num, questions:[] });
      }
      editingPageId=null; saveData(data); render();
    });
    const cancelP = document.getElementById('cancelPageEditBtn');
    if(cancelP) cancelP.addEventListener('click', ()=>{ editingPageId=null; render(); });
    document.querySelectorAll('[data-editpage]').forEach(b=>b.addEventListener('click', ()=>{
      editingPageId = b.dataset.editpage; render();
    }));
    document.querySelectorAll('[data-delpage]').forEach(b=>b.addEventListener('click', ()=>{
      if(confirm(t('deletePageConfirm'))){
        const book = data.books.find(b=>b.id===adminSelectedBookId);
        book.pages = book.pages.filter(p=>p.id!==b.dataset.delpage);
        if(adminSelectedPageId===b.dataset.delpage) adminSelectedPageId=null;
        saveData(data); render();
      }
    }));
  }

  if(adminTab==='questions'){
    const bookSel = document.getElementById('bookSelect');
    if(bookSel) bookSel.addEventListener('change', ()=>{ adminSelectedBookId=bookSel.value; adminSelectedPageId=null; editingQuestionId=null; currentOptionCount=4; render(); });
    const pageSel = document.getElementById('pageSelect');
    if(pageSel) pageSel.addEventListener('change', ()=>{ adminSelectedPageId=pageSel.value; editingQuestionId=null; currentOptionCount=4; render(); });

    const addOptBtn = document.getElementById('addOptionBtn');
    if(addOptBtn) addOptBtn.addEventListener('click', ()=>{
      if(currentOptionCount<4){ currentOptionCount++; render(); }
    });
    document.querySelectorAll('[data-removeopt]').forEach(b=>b.addEventListener('click', ()=>{
      if(currentOptionCount>2){ currentOptionCount--; render(); }
    }));

    const saveQ = document.getElementById('saveQuestionBtn');
    if(saveQ) saveQ.addEventListener('click', ()=>{
      const book = data.books.find(b=>b.id===adminSelectedBookId);
      const page = book.pages.find(p=>p.id===adminSelectedPageId);
      const text = document.getElementById('qTextInput').value.trim();
      const opts = Array.from({length:currentOptionCount}).map((_,i)=>document.getElementById('optInput'+i).value.trim());
      const correct = parseInt(document.getElementById('correctSelect').value,10);
      if(!text || opts.some(o=>!o)) return;
      if(editingQuestionId){
        const q = page.questions.find(x=>x.id===editingQuestionId);
        q.text=text; q.options=opts; q.correct=correct;
      } else {
        page.questions.push({ id:uid('q'), text, options:opts, correct });
      }
      editingQuestionId=null; currentOptionCount=4; saveData(data); render();
    });
    const cancelQ = document.getElementById('cancelQEditBtn');
    if(cancelQ) cancelQ.addEventListener('click', ()=>{ editingQuestionId=null; currentOptionCount=4; render(); });
    document.querySelectorAll('[data-editq]').forEach(b=>b.addEventListener('click', ()=>{
      editingQuestionId=b.dataset.editq; render();
    }));
    document.querySelectorAll('[data-delq]').forEach(b=>b.addEventListener('click', ()=>{
      const book = data.books.find(b=>b.id===adminSelectedBookId);
      const page = book.pages.find(p=>p.id===adminSelectedPageId);
      page.questions = page.questions.filter(q=>q.id!==b.dataset.delq);
      saveData(data); render();
    }));
  }

  if(adminTab==='bulk'){
    const bookSel = document.getElementById('bulkBookSelect');
    if(bookSel) bookSel.addEventListener('change', ()=>{ adminSelectedBookId=bookSel.value; adminSelectedPageId=null; render(); });
    const pageSel = document.getElementById('bulkPageSelect');
    if(pageSel) pageSel.addEventListener('change', ()=>{ adminSelectedPageId=pageSel.value; render(); });

    const parseBtn = document.getElementById('bulkParseBtn');
    if(parseBtn) parseBtn.addEventListener('click', ()=>{
      const raw = document.getElementById('bulkTextArea').value;
      const msgEl = document.getElementById('bulkMsg');
      const book = data.books.find(b=>b.id===adminSelectedBookId);
      if(!book) return;

      const sections = splitByPageMarkers(raw);
      let totalImported = 0;
      let pagesTouched = 0;

      if(sections){
        // multi-page mode: route each section to its page, creating pages as needed
        sections.forEach(sec=>{
          const parsed = parseBulkText(sec.text);
          if(parsed.length===0) return;
          let page = book.pages.find(p=>p.number===sec.number);
          if(!page){ page = { id:uid('pg'), number:sec.number, questions:[] }; book.pages.push(page); }
          parsed.forEach(p=> page.questions.push({ id:uid('q'), text:p.text, options:p.options, correct:p.correct }));
          totalImported += parsed.length;
          pagesTouched++;
        });
        if(totalImported===0){
          msgEl.textContent = t('bulkNoneFound'); msgEl.className='inline-msg bad'; return;
        }
        saveData(data);
        msgEl.textContent = t('bulkSuccessMulti')(totalImported, pagesTouched); msgEl.className='inline-msg ok';
        document.getElementById('bulkTextArea').value='';
        render();
      } else {
        // single-page mode: use the page selected in the dropdown (existing behaviour)
        const page = book.pages.find(p=>p.id===adminSelectedPageId);
        if(!page){
          msgEl.textContent = t('pickBookFirst'); msgEl.className='inline-msg bad'; return;
        }
        const parsed = parseBulkText(raw);
        if(parsed.length===0){
          msgEl.textContent = t('bulkNoneFound'); msgEl.className='inline-msg bad'; return;
        }
        parsed.forEach(p=> page.questions.push({ id:uid('q'), text:p.text, options:p.options, correct:p.correct }));
        saveData(data);
        msgEl.textContent = t('bulkSuccess')(parsed.length); msgEl.className='inline-msg ok';
        document.getElementById('bulkTextArea').value='';
      }
    });
  }

  if(adminTab==='data'){
    document.getElementById('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download='quiz-bookshelf-data.json'; a.click();
      URL.revokeObjectURL(url);
    });
    const fileInput = document.getElementById('jsonFileInput');
    document.getElementById('importBtn').addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        const msgEl = document.getElementById('dataMsg');
        try{
          let parsed = JSON.parse(reader.result);
          if(!parsed.books || !Array.isArray(parsed.books)) throw new Error('bad shape');
          parsed = migrateToPages(parsed);
          data = parsed; saveData(data);
          msgEl.textContent = t('dataImportedOk'); msgEl.className='inline-msg ok';
          adminSelectedBookId=null; adminSelectedPageId=null;
        }catch(err){
          msgEl.textContent = t('dataImportedBad'); msgEl.className='inline-msg bad';
        }
      };
      reader.readAsText(file);
      fileInput.value='';
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      if(confirm(t('dataResetConfirm'))){
        data = JSON.parse(JSON.stringify(SAMPLE_DATA)); saveData(data);
        adminSelectedBookId=null; adminSelectedPageId=null; render();
      }
    });
  }
}

/* ---- Bulk text parser (2-4 options; C/D optional) ---- */
function parseBulkText(raw){
  const blocks = raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const results = [];
  blocks.forEach(block=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    let qText=null, opts=['','','',''], correctLetter=null;
    lines.forEach(line=>{
      let m;
      if(m = line.match(/^Q[:\.]\s*(.+)$/i)) qText = m[1].trim();
      else if(m = line.match(/^A\)\s*(.+)$/i)) opts[0]=m[1].trim();
      else if(m = line.match(/^B\)\s*(.+)$/i)) opts[1]=m[1].trim();
      else if(m = line.match(/^C\)\s*(.+)$/i)) opts[2]=m[1].trim();
      else if(m = line.match(/^D\)\s*(.+)$/i)) opts[3]=m[1].trim();
      else if(m = line.match(/^Correct[:\.]\s*([ABCDabcd])/)) correctLetter = m[1].toUpperCase();
    });
    const filledOpts = opts.filter(o=>o);
    if(qText && filledOpts.length>=2 && correctLetter){
      const correctIdx = correctLetter.charCodeAt(0)-65;
      if(correctIdx < filledOpts.length){
        results.push({ text:qText, options:filledOpts, correct:correctIdx });
      }
    }
  });
  return results;
}

/* Splits pasted text into per-page sections wherever a line like "Page: 3" or
   "صفحہ: 3" appears. Returns null if no such marker is found anywhere, so the
   caller can fall back to single-page (dropdown-selected) import. */
function splitByPageMarkers(raw){
  const markerRegex = /^(?:page|صفحہ)\s*[:\.]?\s*(\d+)\s*$/i;
  const lines = raw.split('\n');
  let sections = [];
  let current = null;
  let found = false;
  lines.forEach(line=>{
    const m = line.trim().match(markerRegex);
    if(m){
      found = true;
      current = { number: parseInt(m[1],10), lines: [] };
      sections.push(current);
    } else if(current){
      current.lines.push(line);
    }
    // lines before the first marker (if any) are ignored — nothing to attach them to
  });
  if(!found) return null;
  return sections.map(s=>({ number:s.number, text:s.lines.join('\n') }));
}
